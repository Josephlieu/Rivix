name: Security

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Secret and malware guard
    runs-on: ubuntu-latest
    # Runs BEFORE npm install, so a bad install script cannot hide itself.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: node scripts/guard.mjs

  audit:
    name: Vulnerable packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Audit packages used by the live site
        run: npm audit --omit=dev --audit-level=high

  gitleaks:
    name: Gitleaks (whole history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:latest detect --source=. --redact --verbose --exit-code=1
