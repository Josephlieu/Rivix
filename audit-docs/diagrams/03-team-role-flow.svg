<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450" role="img">
<title>Team or sales role flow, proposed</title>
<desc>None of this exists today. A proposed team member login and dashboard would give each rep their own assigned clients, orders, a certificate upload tool, replication management, and direct messaging with clients.</desc>
