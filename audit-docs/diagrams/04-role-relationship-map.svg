<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" role="img">
<title>Relationship between admin, team, and customer roles</title>
<desc>Admin already has full visibility into every customer today. Admin creating and assigning team members, team members being linked to specific customers, and customers messaging their assigned team member are all proposed relationships that do not exist yet.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif}
.ts{font-size:12px;fill:#5f5e5a}
.th{font-size:14px;font-weight:600}
.arr{stroke:#5f5e5a;stroke-width:1.5;fill:none}
.gray rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.5}
.gray .th{fill:#2C2C2A}
.gray .ts2{fill:#444441;font-size:12px}
.teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.5;stroke-dasharray:4,3}
.teal .th{fill:#085041}
.teal .ts2{fill:#0F6E56;font-size:12px}
</style>
<defs><marker id="arrow4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="gray"><rect x="250" y="40" width="180" height="55" rx="4"/>
<text x="340" y="63" text-anchor="middle" class="th">Admin</text>
<text x="340" y="80" text-anchor="middle" class="ts2">Joseph, Peter, Sayem</text></g>
<g class="teal"><rect x="250" y="180" width="180" height="55" rx="4"/>
<text x="340" y="203" text-anchor="middle" class="th">Team / sales</text>
<text x="340" y="220" text-anchor="middle" class="ts2">~10 reps, proposed</text></g>
<g class="gray"><rect x="250" y="320" width="180" height="55" rx="4"/>
<text x="340" y="343" text-anchor="middle" class="th">Customer</text>
<text x="340" y="360" text-anchor="middle" class="ts2">One per company</text></g>
<line x1="310" y1="95" x2="310" y2="178" class="arr" style="stroke-dasharray:4,3" marker-end="url(#arrow4)"/>
<text x="235" y="140" text-anchor="end" class="ts">Creates and assigns</text>
<line x1="310" y1="235" x2="310" y2="318" class="arr" style="stroke-dasharray:4,3" marker-end="url(#arrow4)"/>
<text x="235" y="280" text-anchor="end" class="ts">Rep shown to customer</text>
<line x1="370" y1="318" x2="370" y2="237" class="arr" style="stroke-dasharray:4,3" marker-end="url(#arrow4)"/>
<text x="445" y="280" text-anchor="start" class="ts">Messages (proposed)</text>
<polyline points="430,67 590,67 590,347 430,347" fill="none" class="arr" marker-end="url(#arrow4)"/>
<text x="590" y="55" text-anchor="middle" class="ts">Full visibility</text>
<line x1="43" y1="398" x2="63" y2="398" class="arr"/><text x="70" y="402" class="ts">Exists today</text>
<line x1="43" y1="416" x2="63" y2="416" class="arr" style="stroke-dasharray:4,3"/><text x="70" y="420" class="ts">Proposed, not built</text>
</svg>
